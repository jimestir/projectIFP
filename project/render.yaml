services:
  - type: web
    name: stock-for-pymes-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    region: frankfurt
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock-for-pymes-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: API_PORT
        value: "3000"
      - key: API_HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /api/health

databases:
  - name: stock-for-pymes-db
    plan: free
    databaseName: stock_for_pymes
    region: frankfurt
